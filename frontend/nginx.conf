# A TLS terminator in front of this container reports https here; without one,
# fall back to the connection's own scheme. Do not expose nginx directly when
# it is behind such a proxy, or a client could spoof the header.
map $http_x_forwarded_proto $kadai_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Vite emits content-hashed files under /assets; cache them forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Always revalidate the shell so a deploy is picked up immediately.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $kadai_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
