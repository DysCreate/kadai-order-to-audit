services:
  - type: web
    name: kadai-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    # .github/workflows/ci.yml triggers the deploy hook after CI passes.
    autoDeploy: false
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_PROXY_SECRET
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      # Free instances sleep; keep the log level quiet but useful.
      - key: LOG_LEVEL
        value: INFO
