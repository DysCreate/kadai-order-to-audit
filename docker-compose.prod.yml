# Production stack for a single AWS EC2 server.
#   Browser --HTTPS--> caddy --> web (nginx + React) --/api--> api (Django) --> db (Postgres)
# All values come from .env.prod (copy .env.prod.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kadai
      POSTGRES_USER: kadai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kadai:${DB_PASSWORD}@db:5432/kadai
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      SEED_ON_START: ${SEED_ON_START:-1}
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
