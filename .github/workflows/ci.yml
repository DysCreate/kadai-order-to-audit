name: CI

on:
  # Pushes to dev, and pull requests that target main. Nothing else triggers CI.
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend – lint, type, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kadai_test
          POSTGRES_USER: kadai
          POSTGRES_PASSWORD: kadai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt -r requirements/test.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy apps/ core/ --ignore-missing-imports
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgresql://kadai:kadai_test@localhost:5432/kadai_test

      - name: Pytest
        run: pytest --cov=core --cov=apps --cov-report=xml --cov-fail-under=80
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgresql://kadai:kadai_test@localhost:5432/kadai_test
          SECRET_KEY: ci-test-secret-key

      - name: Benchmark Console
        run: |
          python manage.py migrate --noinput
          python manage.py run_benchmark
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgresql://kadai:kadai_test@localhost:5432/kadai_test
          SECRET_KEY: ci-test-secret-key

      - name: Security – Bandit
        run: pip install bandit && bandit -r apps/ core/ -ll

      - name: Security – pip-audit
        run: pip install pip-audit && pip-audit -r requirements/base.txt

  frontend:
    name: Frontend – lint, type, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: ESLint
        run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: "false"

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest
        run: npm test

  security:
    name: Security – Gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action lists a pull request's commits through the REST API and
    # comments on the PR when it finds a leak, so it needs pull-requests access.
    # Without this the job dies with 403 "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
